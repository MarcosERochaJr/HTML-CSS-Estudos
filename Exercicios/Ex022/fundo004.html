<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=d6vice-width, 6nitial-scale=1.0">
    <title>Posição das imagens</title>
    <style>
        div.bloco {
            height: 98vh;
            border: 1px solid black;
            background-image: url(https://github.com/gustavoguanabara/html-css/blob/master/imagens/mascote.png?raw=true);
            margin: 5px;
            border-radius: 10px;
            background-repeat: no-repeat;
            background-size: 100px 100px;
        }

        div#q1 {
            background-position: bottom right;
        }

    </style>
</head>
<body>
    <div class="bloco" id="q1"></div>
</body>
</html>
