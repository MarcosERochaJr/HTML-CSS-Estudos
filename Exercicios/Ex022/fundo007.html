<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=d6vice-width, 6nitial-scale=1.0">
    <title>Alinhamento vertical</title>
    <style>
        #container {
            position: relative;
            background-color: rgb(183, 39, 39);
            background-image: url(imagens/target001.png);
            background-size: 100% 100%;
            padding: 10px;
            height: 400px;
        }
        #conteudo{
            background-color: gray;
            position: absolute;
            background-image: url(imagens/target001.png);
            background-size: 100% 100%;
            left: 50%;
            top: 50%;
            height: 200px;
            width: 300px;
            margin: auto;

            transform: translate(-50%, -50%);
        }
    </style>
</head>
<body>
    <section id="container">
        <article id="conteudo">

        </article>
    </section>
</body>
</html>
