<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tabelas grandes</title>
    <style>
        body {
            font-family: Arial, Helvetica, sans-serif;
        }

        table {
            width: 500px;
            border-collapse: collapse;
            position: relative;
        }

        td, th {
            border: 1px solid black;
            padding: 10px;
        }

        thead {
            background-color: rgb(47, 47, 47);
            color: white;
            position: sticky;
            top: -1px;
        }

        td.num {
            text-align: right;
        }
        
        tfoot {
            background-color: darkgray;
        }

        caption {
            font-size: 1.5em;
            font-weight: bolder;
            background-color: lightgray;
            padding: 10px;
        }

        tbody > tr:nth-child(odd) {
            background-color: rgb(218, 218, 218);
        }
    </style>
</head>
<body>
    <h1>Tabelas grandes</h1>
    <table>
        <caption>População das Unidades Federativas</caption>
       <thead>
            <tr>
                <th scope="col">Estado</th>
                <th>População</th>
            </tr>
       </thead>
       <tbody>
            <tr>
                <td>São Paulo</td>
                <td class="num">46 081 801</td>
            </tr>
            <tr>
                <td>Minas Gerais</td>
                <td class="num">21 393 441</td>
            </tr>
            <tr>
                <td>Rio de Janeiro</td>
                <td class="num">17 223 547</td>
            </tr>
            <tr>
                <td>Bahia</td>
                <td class="num">14 870 907</td>
            </tr>
            <tr>
                <td>Paraná</td>
                <td class="num">11 890 517</td>
            </tr>
            <tr>
                <td>Rio Grande do Sul</td>
                <td class="num">11 233 263</td>
            </tr>
            <tr>
                <td>Pernambuco</td>
                <td class="num">9 562 007</td>
            </tr>
       </tbody>
       <tfoot>
            <tr>
                <th scope="row">Total de Habitantes</th>
                <td class="num"><strong>132 255 483</strong></td>
            </tr>
       </tfoot>
    </table>
</body>
</html>
